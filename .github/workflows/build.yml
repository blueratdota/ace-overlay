# Builds the portable Windows package on GitHub, so nobody needs Python to get the app.
# - Every push to main (and a manual "Run workflow"): the package is attached to the run as the
#   "ace-overlay-win64" artifact (Actions tab -> latest run -> Artifacts).
# - Pushing a version tag (v*): the zip is also published as a GitHub Release.
name: Build portable package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # only used to publish a release for version tags

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen  # build.py draws the app icon with Qt; no display needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e .[build]

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: python build.py

      - name: Upload the app folder (one download, one extract)
        uses: actions/upload-artifact@v4
        with:
          name: ace-overlay-win64
          path: dist/ace-overlay/

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ace-overlay-*-win64.zip
          generate_release_notes: true
