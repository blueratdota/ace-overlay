[project]
name = "ace-overlay"
version = "0.1.0"
description = "Real-time telemetry overlay for Assetto Corsa EVO"
requires-python = ">=3.11"  # build.py uses tomllib
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.7"]  # QFont.setFeature (tabular digits)

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]
dev = ["pillow>=10"]  # tools/screenshots.py (animated GIF)

[project.gui-scripts]
ace-overlay = "ace_overlay.app:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string + `license-files`
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ace_overlay"]
