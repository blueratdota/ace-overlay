[project]
name = "ace-overlay"
version = "0.1.0"
description = "Inputs overlay for Assetto Corsa EVO"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
build = ["pyinstaller>=6.10"]

[project.gui-scripts]
ace-overlay = "ace_overlay.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ace_overlay"]
